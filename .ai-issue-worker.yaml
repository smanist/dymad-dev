# Local AI Issue Worker configuration
# Replace repo with the target GitHub repository in owner/repo form.
# Verifier commands run inside the issue worktree and are trusted local config.
repo: smanist/dymad-dev
base_branch: worker_test
paths:
  worktree_root: .ai-worktrees
  run_root: .ai-runs
  log_root: .ai-logs
  runtime_root: .ai-runtime
scheduler:
  interval_minutes: 30
issue_selection:
  ready_label: ai-ready
  working_label: ai-working
  failed_label: ai-failed
  pr_opened_label: ai-pr-opened
  blocked_labels:
  - blocked
  - needs-human
  max_issues_per_run: 1
  selection_order: oldest_updated
git:
  branch_prefix: ai/issue-
  keep_worktree_on_success: false
  keep_worktree_on_failure: true
  commit_message_template: 'Fix issue #{number}: {title}'
  allow_dirty_base: false
  remove_ready_on_pr: false
agent:
  backend: codex
  command: codex
  timeout_minutes: 30
  max_repair_attempts: 1
verify:
  commands:
  - make check
  - pytest -m "not slow and not extra_slow"
  run_all_commands: true
diff_policy:
  max_changed_files: 30
  max_diff_lines: 2000
  reject_paths:
  - .env
  - .secrets
  - '**/*.pem'
  - '**/*.key'
  allow_lockfile_changes: false
pr:
  draft: true
  title_template: 'Fix #{number}: {title}'
  body_template: 'Closes #{number}


    ## Summary

    This PR was generated by the local AI issue worker.


    ## Verification

    {verification_summary}


    ## Changed files

    {changed_files}


    ## Agent notes

    {agent_notes}

    '
