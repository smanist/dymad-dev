display_name: DyMAD Train/Eval Workflow
short_description: Train/evaluate DyMAD models with MCP, then export reproducible CLI configs and run manifests.
default_prompt: Use DyMAD MCP tools to register and inspect datasets, call describe_training_capability, translate the user's modeling request into structured overrides while omitting runtime-owned fields such as data.path and model.name, call compile_training_request and start_training_run, evaluate the checkpoint using a metric from list_evaluation_capabilities, then export a dymad CLI config and rerun commands for auditability.
