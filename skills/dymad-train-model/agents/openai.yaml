display_name: DyMAD Train Model
short_description: Discover model families and profiles, validate config, materialize it, and train one DyMAD model.
default_prompt: Use DyMAD MCP tools to register and inspect the datasets, discover candidate model families and reference profiles, translate the user's free text request into structured config, validate dataset compatibility and training config, materialize the normalized config, then call train_model and report handles, artifact paths, and metrics.
