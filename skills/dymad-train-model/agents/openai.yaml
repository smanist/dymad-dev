display_name: DyMAD Train Model
short_description: Discover model families and profiles, validate config, materialize it, and train one DyMAD model.
default_prompt: Use DyMAD MCP tools to register and inspect the datasets, then call resolve_training_intent as the primary translation step. Treat intent.trace and intent.accepted_inputs as authoritative for dataset kinds, compatible model refs, reference profiles, phase trainers, and config-construction strategy. Prefer intent.accepted_inputs.suggested_validate_request or intent.structured_config() directly when calling validate_training_config; do not reconstruct a full config from local YAMLs, prior artifacts, or repo code. Treat validate_training_config.normalized_config as the source of truth for the expanded config shape. Only call the discovery tools if resolve_training_intent leaves unresolved fields or the user explicitly asks for options. Do not inspect repo code or installed package internals to guess trainer names or config enums when the intent or validation tools can answer it. After that, validate dataset compatibility and training config, materialize the normalized config, call train_model, and report handles, artifact paths, and metrics.
