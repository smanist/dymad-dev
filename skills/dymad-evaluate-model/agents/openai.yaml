display_name: DyMAD Evaluate Model
short_description: Register a checkpoint and dataset, validate compatibility, and evaluate rollout error with the Phase 1 MCP surface.
default_prompt: Use DyMAD MCP tools to register or reuse the checkpoint and test dataset, inspect the dataset, validate checkpoint and dataset compatibility, prepare a prediction request, call predict_checkpoint, compute_rollout_metrics, and plot_rollouts, then report the prediction handle, evaluation handle, metrics path, aggregate metrics, and plot path or skip reason. Respect the current metric limitations and state explicitly when graph plotting is skipped.
