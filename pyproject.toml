[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "dymad"
version         = "0.1.2"
description     = "Dynamics Modeling and Analysis via Data"
authors         = [{name = "APUS Lab @ PSU"}]
readme          = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=3.1.0",
  "imageio>=2.36.0",
  "jax>=0.4.35",
  "numpy>=2.0",
  "matplotlib>=3.9",
  "pytest-rerunfailures",
  "pyyaml>=6.0",
  "scikit-learn>=1.5.2",
  "scipy>=1.14",
  "torch>=2.5",
  "torchdiffeq>=0.2.5",
  "torch-geometric>=2.6"
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.408",
  "ruff>=0.15.7",
]
docs = [
  # keep this list short; matches docs/requirements.txt
  "sphinx>=7",
  "furo",
  "myst-parser",            # optional: Markdown support
  "myst-nb>=1.0",
  "sphinx-autodoc-typehints"
]
test = [
  "pytest>=8",
]
viz = [
  "torchview>=0.2.6",
  "graphviz",
]

# pyproject.toml
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",            # show reasons for skips/xpasses
  "--strict-markers",
  "--maxfail=0",
  "--reruns=2",
  "-q"
]
testpaths = ["tests"]
python_files = ["test_*.py"]
xfail_strict = true
log_cli = true
log_level = "INFO"

markers = [
  "slow: marks tests as slow",
  "extra_slow: marks tests as extra slow"
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
include = ["*.py", "*.pyi"]
exclude = [
  ".git",
  ".ruff_cache",
  ".venv",
  "__pycache__",
  "build",
  "dist",
  "docs/_build",
  "src/dymad.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "B006",
  "B007",
  "B008",
  "B023",
  "B027",
  "B905",
  "E501",
  "E731",
  "E741",
  "UP007",
  "UP040",
  "W293",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"examples/aircraft_system/*.py" = ["E402", "F821"]
"examples/double_pendulum/deprecated/*.py" = ["E402"]
"scripts/**/*_cli.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = [
  "src/dymad",
]
exclude = [
  ".git",
  ".ruff_cache",
  ".venv",
  "__pycache__",
  "build",
  "dist",
  "docs",
  "examples",
  "scripts",
  "src/dymad.egg-info",
  "tests",
]
ignore = [
  # Temporary rollout debt while migrating pyright from a file whitelist to full src coverage.
  "src/dymad/io/checkpoint.py",
  "src/dymad/io/series_adapter.py",
  "src/dymad/io/trajectory_manager.py",
  "src/dymad/losses/losses.py",
  "src/dymad/models/collections.py",
  "src/dymad/models/components.py",
  "src/dymad/models/model_base.py",
  "src/dymad/models/recipes.py",
  "src/dymad/models/recipes_corr.py",
  "src/dymad/modules/collections.py",
  "src/dymad/modules/gnn.py",
  "src/dymad/modules/helpers.py",
  "src/dymad/modules/kernel.py",
  "src/dymad/modules/krr.py",
  "src/dymad/modules/linear.py",
  "src/dymad/modules/mlp.py",
  "src/dymad/modules/sequential.py",
  "src/dymad/numerics/complex.py",
  "src/dymad/numerics/dm.py",
  "src/dymad/numerics/gradients.py",
  "src/dymad/numerics/linalg.py",
  "src/dymad/numerics/manifold.py",
  "src/dymad/sako/adapter.py",
  "src/dymad/sako/base.py",
  "src/dymad/sako/rals.py",
  "src/dymad/sako/sako.py",
  "src/dymad/training/driver.py",
  "src/dymad/training/ls_update.py",
  "src/dymad/training/phases.py",
  "src/dymad/training/trainer_run.py",
  "src/dymad/utils/control.py",
  "src/dymad/utils/graph.py",
  "src/dymad/utils/plot.py",
  "src/dymad/utils/sampling.py",
  "src/dymad/utils/scheduler.py",
  "src/dymad/utils/wrapper.py",
]
extraPaths = ["src"]
reportMissingImports = "none"
reportMissingTypeStubs = "none"
