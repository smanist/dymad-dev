data:
  path: './data/lti_vlen.npz'
  double_precision: false
  # Leave n_steps unset so each trajectory keeps its own native horizon.

transform_x:
  type: "identity"

transform_u:
  type: "identity"

split:
  train_frac: 0.75

dataloader:
  batch_size: 16
  shuffle: true

model:
  name: 'lti_vlen_ldm_wf'
  encoder_layers: 0
  processor_layers: 1
  decoder_layers: 0
  hidden_dimension: 32
  activation: "none"
  weight_init: "xavier_uniform"
  input_order: "cubic"

criterion:
  dynamics:
    weight: 1.0
  recon:
    weight: 1.0

training:
  n_epochs: 500
  save_interval: 10
  load_checkpoint: false
  learning_rate: 5e-3
  decay_rate: 0.999
  weak_form_params:
    N: 9
    dN: 2
    ordpol: 2
    ordint: 2
